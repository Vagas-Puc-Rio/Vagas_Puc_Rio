{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login {{ tipo|title }}</title>

    <style>
        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
        @import url('https://fonts.googleapis.com/css2?family=Jaldi:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background-color: #F7F5F2;
            font-family: 'Jaldi', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        .caixa-branca {
            background: white;
            width: 100%;
            max-width: 986px;
            min-height: 681px;
            border-radius: 38px;
            border: 1px solid rgba(0, 0, 0, 0.28);
            position: relative;
            text-align: center;
            padding: 110px 0 60px 0;
        }

        .logo-puc {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 90px;
            height: auto;
        }

        .btn-voltar {
            position: absolute;
            top: 26px;
            left: 28px;
            font-size: 34px;
            color: black;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitulo {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .form-login {
            width: 440px;
            margin: 0 auto;
            text-align: left;
        }

        .form-grupo {
            margin-bottom: 22px;
        }

        .form-grupo label {
            display: block;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .asterisco {
            color: red;
        }

        .form-grupo input {
            width: 100%;
            height: 55px;
            background: #F3F3F3;
            border: none;
            border-radius: 90px;
            padding: 0 18px;
            font-size: 18px;
            font-family: 'Jaldi', sans-serif;
        }

        .form-grupo input::placeholder {
            color: #9b9b9b;
            font-size: 18px;
        }

        .form-grupo input:focus {
            outline: none;
            border: 2px solid #2563EB;
        }

        .btn-entrar {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 90px;
            background: #D9D9D9;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Jaldi', sans-serif;
            cursor: pointer;
            margin-top: 18px;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background: #c4c4c4;
        }

        .cadastro {
            margin-top: 20px;
            font-size: 22px;
            text-align: left;
        }

        .cadastro span {
            color: rgba(0, 0, 0, 0.7);
        }

        .cadastro a {
            color: #0088ff;
            margin-left: 5px;
            font-weight: 700;
        }

        .erro-login {
            background-color: #ffe5e5;
            color: #b00020;
            border: 1px solid #ffb3b3;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="caixa-branca">

        <img src="{% static 'img/image4.png' %}" class="logo-puc">

        <a href="{% url 'home' %}" class="btn-voltar">←</a>

        <h1>LOGIN - {{ tipo }}</h1>

        <p class="subtitulo">Entre com suas credenciais</p>

        <form method="POST" class="form-login">

            {% csrf_token %}

            {% if error %}
                <div class="erro-login">
                    {{ error }}
                </div>
            {% endif %}

            <div class="form-grupo">

                <label>Email <span class="asterisco">*</span></label>

                <input 
                    type="email"
                    name="email"
                    placeholder="nome@{{ tipo|lower }}.puc-rio.br"
                    required
                >

            </div>

            <div class="form-grupo">

                <label>Senha <span class="asterisco">*</span></label>

                <input 
                    type="password"
                    name="senha"
                    required
                >

            </div>

            <button type="submit" class="btn-entrar">
                ENTRAR
            </button>

            <p class="cadastro">

                <span>Não tem conta?</span>

                {% if tipo|lower == 'professor' %}

                    <a href="{% url 'cadastro_professor' %}">
                        Cadastre-se
                    </a>

                {% else %}

                    <a href="{% url 'cadastro_aluno' %}">
                        Cadastre-se
                    </a>

                {% endif %}

            </p>

        </form>

    </div>

</body>
</html>
