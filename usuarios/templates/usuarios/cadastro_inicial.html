{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de {{ tipo|title }}</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jaldi:wght@400;700&display=swap');

        body {
            background-color: #F7F5F2;
            font-family: 'Jaldi', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .caixa-branca {
            background: white;
            width: 100%;
            max-width: 986px;
            min-height: 681px;
            padding: 80px 0 60px 0;
            border-radius: 38px;
            border: 1px solid rgba(0, 0, 0, 0.28);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        .logo-puc {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 90px;
            height: auto;
        }

        .btn-voltar {
            position: absolute;
            top: 26px;
            left: 28px;
            font-size: 34px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .caixa-branca h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .caixa-branca p {
            font-size: 24px;
            margin: 0 0 40px 0;
        }

        form {
            width: 440px;
            margin: 0 auto;
            text-align: left;
        }

        .form-grupo {
            margin-bottom: 22px;
        }

        .form-grupo label {
            display: block;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .asterisco {
            color: red;
        }

        .form-grupo input {
            width: 100%;
            height: 55px;
            background-color: #F3F3F3;
            border: none;
            border-radius: 90px;
            font-size: 18px;
            padding: 0 18px;
            box-sizing: border-box;
            font-family: 'Jaldi', sans-serif;
        }

        .form-grupo input::placeholder {
            color: #9b9b9b;
            font-size: 18px;
        }

        .form-grupo input:focus {
            outline: none;
            border: 2px solid #2563EB;
        }

        .btn-cadastrar {
            background: #D9D9D9;
            color: black;
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 90px;
            font-size: 24px;
            font-weight: 700;
            margin-top: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Jaldi', sans-serif;
        }

        .btn-cadastrar:hover {
            background: #c4c4c4;
        }

        .errorlist {
            color: red;
            list-style: none;
            padding: 0;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="caixa-branca">

        <img src="{% static 'img/image4.png' %}" class="logo-puc">

        <a href="{% url 'home' %}" class="btn-voltar">←</a>

        <h1>CADASTRO - {{ tipo }}</h1>
        <p>Entre com suas credenciais</p>

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="tipo_conta" value="{{ tipo }}">

            <div class="form-grupo">
                <label>Nome <span class="asterisco">*</span></label>
                {{ form.nome }}
                {{ form.nome.errors }}
            </div>

            <div class="form-grupo">
                <label>Email <span class="asterisco">*</span></label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>

            <div class="form-grupo">
                <label>Senha <span class="asterisco">*</span></label>
                {{ form.senha }}
                {{ form.senha.errors }}
            </div>

            <div class="form-grupo">
                <label>Confirmar senha <span class="asterisco">*</span></label>
                {{ form.confirmar_senha }}
                {{ form.confirmar_senha.errors }}
            </div>

            <button type="submit" class="btn-cadastrar">CADASTRAR</button>
        </form>

    </div>

    <script>
    const tipoConta = "{{ tipo|lower }}";
    const emailInput = document.querySelector('input[name="email"]');

    if (emailInput) {

        emailInput.required = true;

        if (tipoConta === "professor") {

            emailInput.placeholder = "nome@professor.puc-rio.br";

        } else {

            emailInput.placeholder = "nome@aluno.puc-rio.br";

        }
    }
    </script>

</body>
</html>
