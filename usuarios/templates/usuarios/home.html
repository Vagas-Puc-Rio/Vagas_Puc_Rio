{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagas PUC-Rio</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Jaldi:wght@400;700&display=swap');

        body {
            background-color: #F7F5F2;
            font-family: 'Jaldi', sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: white;
            width: 100%;
            padding: 18px 50px;
            box-sizing: border-box;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .puc-box {
            background-color: #2563EB;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 24px;
        }

        .carreiras-text {
            color: #1E293B;
            font-weight: 700;
            font-size: 24px;
        }

        .conteudo-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            position: relative;
        }

        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            width: 380px;
            padding: 40px;

            border-radius: 38px;

            border: 1px solid rgba(0, 0, 0, 0.10);

            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.05);

            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;

            position: relative;
        }

        .icone {
            width: 86px;
            height: 86px;

            background: rgba(0, 134, 169, 0.35);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 42px;
            margin: 0 0 10px 0;
        }

        .card p {
            font-size: 24px;
            color: #555;
            margin: 0 0 35px 0;
            min-height: 60px;
        }

        .btn-entrar {
            background: #2C2C2C;
            color: white;

            width: 100%;

            padding: 18px;

            border-radius: 20px;

            text-decoration: none;

            font-size: 28px;
            font-weight: 700;

            margin-bottom: 18px;

            transition: 0.3s;

            box-sizing: border-box;
        }

        .btn-cadastrar {
            background: white;
            color: black;

            width: 100%;

            padding: 18px;

            border-radius: 20px;

            text-decoration: none;

            font-size: 28px;
            font-weight: 700;

            border: 2px solid #E2E8F0;

            transition: 0.3s;

            box-sizing: border-box;
        }

        .btn-entrar:hover,
        .btn-cadastrar:hover {
            opacity: 0.8;
        }

        .logo-puc {
            position: fixed;

            bottom: 20px;
            right: 20px;

            width: 90px;
            height: auto;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo-container">

            <span class="puc-box">PUC-Rio</span>

            <span class="carreiras-text">Carreiras</span>

        </div>

    </nav>

    <main class="conteudo-principal">

        <div class="container">

            <!-- CARD ALUNO -->

            <div class="card">

                <div class="icone">🎓</div>

                <h2>Aluno</h2>

                <p>Encontre suas vagas de IC/Estágio</p>

                <a href="{% url 'login_aluno' %}" class="btn-entrar">
                    Entrar
                </a>

                <a href="{% url 'cadastro_aluno' %}" class="btn-cadastrar">
                    Cadastrar
                </a>

            </div>

            <!-- CARD PROFESSOR -->

            <div class="card">

                <div class="icone">📚</div>

                <h2>Professor</h2>

                <p>Cadastre suas vagas</p>

                <a href="{% url 'login_professor' %}" class="btn-entrar">
                    Entrar
                </a>

                <a href="{% url 'cadastro_professor' %}" class="btn-cadastrar">
                    Cadastrar
                </a>

            </div>

            <!-- CARD COLABORADOR -->

            <div class="card">

                <div class="icone">🏢</div>

                <h2>Colaborador</h2>

                <p>Cadastre sua empresa</p>

                <a href="#" class="btn-entrar">
                    Entrar
                </a>

                <a href="#" class="btn-cadastrar">
                    Cadastrar
                </a>

            </div>

        </div>

    </main>

    <img src="{% static 'img/image4.png' %}" class="logo-puc">

</body>
</html>
