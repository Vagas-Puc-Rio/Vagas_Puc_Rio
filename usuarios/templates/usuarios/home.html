<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagas PUC-Rio</title>
    <style>
        /* CSS Limpo e Responsivo */
        body {
            background-color: #F7F5F2;
            font-family: 'Inter', sans-serif;
            margin: 0; /* Remove as margens padrão do navegador */
            padding: 0;
        }

        /* --- ESTILOS DA NAVBAR (MENU SUPERIOR) --- */
        .navbar {
            background-color: white;
            width: 100%;
            padding: 15px 50px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between; /* Joga a logo pra esquerda e os botões pra direita */
            align-items: center;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.05); /* Sombra bem levinha */
            
            /* Isso aqui faz o menu grudar no topo ao rolar a página! */
            position: sticky;
            top: 0;
            z-index: 1000; 
        }

        /* Lado esquerdo da Navbar */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .puc-box {
            background-color: #2563EB; /* Azul do Figma */
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 20px;
        }

        .carreiras-text {
            color: #1E293B; /* Azul bem escuro/quase preto */
            font-weight: 800;
            font-size: 20px;
        }

        /* Lado direito da Navbar */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-entrar {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            font-size: 16px;
        }

        .nav-cadastrar {
            text-decoration: none;
            background-color: #2563EB;
            color: white;
            padding: 10px 24px;
            border-radius: 50px; /* Borda bem redonda (estilo pílula) */
            font-weight: 600;
            font-size: 16px;
        }

        .nav-entrar:hover, .nav-cadastrar:hover {
            opacity: 0.8;
        }

        /* --- ESTILOS DO CONTEÚDO PRINCIPAL --- */
        .conteudo-principal {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px; /* Dá um respiro entre a navbar e os cartões */
            min-height: 120vh; /* Altura extra de propósito só para você conseguir testar a rolagem! */
        }

        .container {
            display: flex;
            gap: 40px; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .card {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icone {
            width: 86px;
            height: 86px;
            background: rgba(0, 134, 169, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 32px;
            margin: 0 0 10px 0;
        }

        .card p {
            font-size: 20px;
            color: #555;
            margin: 0 0 30px 0;
            height: 60px;
        }

        /* Botões dos Cartões */
        .btn-entrar {
            background: black;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn-cadastrar {
            background: white;
            color: black;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            box-sizing: border-box;
            border: 2px solid #E2E8F0; /* Adicionei uma bordinha cinza pra destacar do fundo branco */
        }

        .btn-entrar:hover, .btn-cadastrar:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <span class="puc-box">PUC-Rio</span>
            <span class="carreiras-text">Carreiras</span>
        </div>
        
        <div class="nav-links">
            <a href="#" class="nav-entrar">Entrar</a>
            <a href="#" class="nav-cadastrar">Cadastrar</a>
        </div>
    </nav>

    <main class="conteudo-principal">
        
        <div class="container">
            <div class="card">
                <div class="icone">🎓</div>
                <h2>Aluno</h2>
                <p>Encontre suas vagas de IC/Estágio</p>
                <a href="#" class="btn-entrar">Entrar</a>
                <a href="{% url 'cadastro' 'aluno' %}" class="btn-cadastrar">Cadastrar</a>
            </div>

            <div class="card">
                <div class="icone">📚</div>
                <h2>Professor</h2>
                <p>Cadastre suas vagas</p>
                <a href="#" class="btn-entrar">Entrar</a>
                <a href="{% url 'cadastro' 'professor' %}" class="btn-cadastrar">Cadastrar</a>
            </div>

            <div class="card">
                <div class="icone">🏢</div>
                <h2>Colaborador</h2>
                <p>Cadastre sua empresa</p>
                <a href="#" class="btn-entrar">Entrar</a>
                <a href="{% url 'cadastro' 'colaborador' %}" class="btn-cadastrar">Cadastrar</a>
            </div>
        </div>

    </main>

</body>
</html>
